<div class="container py-5">
  <h1 class="fw-bold text-primary mb-4 text-center">Détection de Plaques via Webcam</h1>

  <!-- Section Webcam -->
  <section class="mb-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm p-4 text-center">
          <h3 class="mb-4">Flux Webcam</h3>
          <video #video [style.display]="webcamActive ? 'block' : 'none'" autoplay playsinline
            class="img-fluid rounded mb-3" style="max-width: 100%; height: auto;"></video>
          <img *ngIf="realtimeImage" [src]="realtimeImage" alt="Webcam Feed" class="img-fluid rounded mb-3"
            style="max-width: 100%; height: auto;" />
          <canvas #canvas style="display: none;"></canvas>
          <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-success" (click)="startWebcam()" *ngIf="!webcamActive">
              Activer Webcam
            </button>
            <button class="btn btn-success" (click)="startRealtimeDetection()" *ngIf="webcamActive && !realtimeActive">
              Démarrer Détection
            </button>
            <button class="btn btn-danger" (click)="stopRealtimeDetection()" *ngIf="realtimeActive">
              Arrêter Détection
            </button>
            <button class="btn btn-danger" (click)="stopWebcam()" *ngIf="webcamActive">
              Arrêter Webcam
            </button>
            <button class="btn btn-primary" (click)="loadHistoricalPlates()" *ngIf="!showHistorical">
              Charger Historique
            </button>
            <button class="btn btn-secondary" (click)="clearHistoricalPlates()" *ngIf="showHistorical">
              Masquer Historique
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Résultats Texte Matricule -->
  <section *ngIf="plateTextResults && plateTextResults.length > 0" class="mb-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm p-4">
          <h3 class="text-center mb-4">Résultats Texte Matricule</h3>
          <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
              <thead class="table-dark">
                <tr>
                  <th scope="col">Matricule</th>
                  <th scope="col">Date de Détection</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let result of plateTextResults">
                  <td>{{ result.text }}</td>
                  <td>{{ result.detectionDate | date:'medium' }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Message si aucun résultat -->
  <section *ngIf="plateTextResults && plateTextResults.length === 0" class="mb-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm p-4 text-center">
          <p class="text-danger">Aucune plaque détectée.</p>
        </div>
      </div>
    </div>
  </section>
</div>
