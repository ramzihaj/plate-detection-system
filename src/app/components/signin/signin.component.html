<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-lg p-4">
        <h2 class="text-center mb-4 fw-bold text-primary">Inscription</h2>
        <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
          {{ errorMessage }}
          <button type="button" class="btn-close" (click)="errorMessage = ''" aria-label="Close"></button>
        </div>
        <form (ngSubmit)="onSignup()" #signupForm="ngForm">
          <div class="mb-3 position-relative">
            <label for="username" class="form-label">Nom d'utilisateur</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input
                type="text"
                class="form-control"
                id="username"
                [(ngModel)]="signupData.username"
                name="username"
                required
                #username="ngModel"
                placeholder="Votre nom d'utilisateur"
              >
            </div>
            <div *ngIf="username.invalid && (username.dirty || username.touched)" class="text-danger mt-1">
              <small *ngIf="username.errors?.['required']">Le nom d'utilisateur est requis.</small>
            </div>
          </div>
          <div class="mb-3 position-relative">
            <label for="email" class="form-label">Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input
                type="email"
                class="form-control"
                id="email"
                [(ngModel)]="signupData.email"
                name="email"
                required
                email
                #email="ngModel"
                placeholder="votre@email.com"
              >
            </div>
            <div *ngIf="email.invalid && (email.dirty || email.touched)" class="text-danger mt-1">
              <small *ngIf="email.errors?.['required']">L'email est requis.</small>
              <small *ngIf="email.errors?.['email']">L'email doit être valide.</small>
            </div>
          </div>
          <div class="mb-3 position-relative">
            <label for="password" class="form-label">Mot de passe</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="password"
                [(ngModel)]="signupData.password"
                name="password"
                required
                #password="ngModel"
                placeholder="••••••••"
              >
            </div>
            <div *ngIf="password.invalid && (password.dirty || password.touched)" class="text-danger mt-1">
              <small *ngIf="password.errors?.['required']">Le mot de passe est requis.</small>
            </div>
          </div>
          <button
            type="submit"
            class="btn btn-primary w-100 btn-gradient"
            [disabled]="signupForm.invalid"
          >
            S'inscrire
          </button>
        </form>
        <p class="mt-3 text-center">
          Déjà un compte ? <a routerLink="/login" class="text-primary text-decoration-none">Connectez-vous</a>
        </p>
      </div>
    </div>
  </div>
</div>
